[project]
name = "mannsahara"
version = "0.1.0"
description = "CSE473 Group 9 synthetic-only student support chatbot"
requires-python = ">=3.11,<3.14"
dependencies = ["streamlit>=1.50,<2", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
exclude = ["tmp", ".local", ".venv", "evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
